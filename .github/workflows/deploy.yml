name: Deploy Docker to VPS

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aleinek/go_game_server
  CONTAINER_NAME: go-game-container

jobs:
  # KROK 1: Budowanie obrazu i wysyłanie do rejestru GitHub
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./go-game-server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # KROK 2: Logowanie na VPS i uruchomienie kontenerów z docker-compose
  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "~/go-game"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GITHUB_TOKEN,GITHUB_ACTOR,REGISTRY,IMAGE_NAME,CONTAINER_NAME,MONGO_PASSWORD
          script: |
            cd ~/go-game
            
            # 1. Zaloguj się do GitHub Container Registry
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            
            # 2. Pobierz najnowszy obraz serwera
            docker pull $REGISTRY/$IMAGE_NAME:latest
            
            # 3. Utwórz plik .env z hasłem do MongoDB
            echo "MONGO_PASSWORD=$MONGO_PASSWORD" > .env
            
            # 4. Zatrzymaj stare kontenery i uruchom nowe przez docker-compose
            docker-compose down || true
            docker-compose up -d
            
            # 5. Poczekaj na uruchomienie i sprawdź status
            sleep 10
            docker-compose ps
            
            # 6. Posprzątaj stare obrazy
            docker image prune -f